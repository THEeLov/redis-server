[package]
name = "redis-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"                 # edition 2024 needs 1.85+
description = "Small in-memory Redis-compatible server speaking RESP2 over a Unix socket"
license = "MIT OR Apache-2.0"
repository = "https://github.com/THEeLov/redis-server"
readme = "README.md"
keywords = ["redis", "resp", "key-value", "unix-socket", "server"]
categories = ["database-implementations", "network-programming", "command-line-utilities"]

[dependencies]
socket-epoll-server = "0.1.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
